name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  portable:
    name: Framework ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: [fmt, test, clippy, docs, tools, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore tracked LFS files
        run: |
          git lfs install --local
          git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        if: matrix.scope != 'fmt' && matrix.scope != 'frontend'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust196-${{ matrix.scope }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-node@v4
        if: matrix.scope == 'frontend'
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        if: matrix.scope == 'frontend'
        with:
          version: 11.9.0

      - name: Verify framework scope
        run: >-
          python3 tools/verify-repository.py
          --scope ${{ matrix.scope }}
          --evidence "$GITHUB_WORKSPACE/.tmp/ci/${{ matrix.scope }}"

      - name: Retain verification report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-${{ matrix.scope }}-verification
          path: |
            .tmp/ci/${{ matrix.scope }}/verification.json
            .tmp/ci/${{ matrix.scope }}/*.log
            .tmp/ci/${{ matrix.scope }}/smoke/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
