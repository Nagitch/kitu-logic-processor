name: Replay determinism

on:
  push:
    paths: &replay-paths
      - ".github/workflows/replay-determinism.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/kitu-app-actions/**"
      - "crates/kitu-core/**"
      - "crates/kitu-ecs/**"
      - "crates/kitu-osc-ir/**"
      - "crates/kitu-runtime/**"
      - "crates/kitu-transport/**"
      - "crates/kitu-unity-ffi/**"
      - "tools/kitu-replay-runner/**"
      - "kitu-integration-runner/scenarios/**"
  pull_request:
    paths: *replay-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  replay:
    name: Native replay (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: Check native Rust target
        run: |
          rustc -vV
          test "$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - name: Test and record two independent replays
        run: |
          cargo test --locked --release --all-targets -p kitu-ecs -p kitu-runtime -p kitu-replay-runner \
            --features kitu-replay-runner/determinism-probe,kitu-runtime/rapier-physics
          cargo test --locked --release -p kitu-unity-ffi
          cargo build --locked --release -p kitu-runtime --features rapier-physics --example spatial_session
          example=target/release/examples/spatial_session
          if [ "$RUNNER_OS" = Windows ]; then example="$example.exe"; fi
          test "$("$example" legacy | tr -d '\r')" = "mode=legacy x_m=2"
          test "$("$example" deterministic | tr -d '\r')" = "mode=deterministic x_m=1"

          mkdir -p target/replay-traces
          for scenario in ordered-motion dynamic-obstacles; do
            for run in 1 2; do
              cargo run --locked --release -p kitu-replay-runner --features determinism-probe \
                --bin kitu-determinism-probe -- \
                "kitu-integration-runner/scenarios/determinism/$scenario.json" \
                "target/replay-traces/$scenario-$run.jsonl"
            done
          done
          cargo run --locked --release -p kitu-replay-runner -- \
            --scenario kitu-integration-runner/scenarios/smoke/player-move-basic/scenario.json \
            --output-dir target/replay-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.target }}
          path: target/replay-traces/*.jsonl
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare four native traces per scenario
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          pattern: replay-*
          path: traces
      - name: Test comparator and compare traces
        run: |
          python3 -m unittest discover -s tools/kitu-replay-runner
          for scenario in ordered-motion dynamic-obstacles; do
            echo "Comparing $scenario"
            python3 tools/kitu-replay-runner/compare_determinism.py --ticks 600 \
              "traces/replay-aarch64-apple-darwin/$scenario-"{1,2}.jsonl \
              "traces/replay-x86_64-pc-windows-msvc/$scenario-"{1,2}.jsonl
          done
