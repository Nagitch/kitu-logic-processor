[package]
name = "kitu-scripting-rhai"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rhai scripting bindings and helpers for the Kitu runtime."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "rhai", "scripting"]
categories = ["game-development"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
rhai = { version = "=1.26.0", features = ["sync", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
