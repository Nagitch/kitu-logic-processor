[package]
name = "kitu-tsq1"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
description = "TSQ1 timeline AST and playback helpers for Kitu."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "timeline", "tsq1"]
categories = ["game-development", "parser-implementations"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
kitu-core = { version = "0.1.0", path = "../kitu-core" }
kitu-osc-ir = { version = "0.1.0", path = "../kitu-osc-ir" }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
tsq1 = { version = "0.1.0", git = "https://github.com/Nagitch/tsq1", rev = "95ad2b38a0cd793a26d3a6d12cde105b5dc584df" }
tsq1-osc = { version = "0.1.0", git = "https://github.com/Nagitch/tsq1", rev = "95ad2b38a0cd793a26d3a6d12cde105b5dc584df" }
