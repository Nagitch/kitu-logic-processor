[package]
name = "kitu-tsq1"
version = "0.1.0"
edition = "2021"
publish = false
description = "TSQ1 timeline AST and playback helpers for Kitu."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "timeline", "tsq1"]
categories = ["game-development", "parser-implementations"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
kitu-core = { path = "../kitu-core" }
kitu-osc-ir = { path = "../kitu-osc-ir" }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsq1 = { git = "https://github.com/Nagitch/tsq1", rev = "05707147e83a4fba591a3933d49f056bb6d3540b" }
tsq1-osc = { git = "https://github.com/Nagitch/tsq1", rev = "05707147e83a4fba591a3933d49f056bb6d3540b" }
