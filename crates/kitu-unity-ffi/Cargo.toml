[package]
name = "kitu-unity-ffi"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
description = "C ABI bindings that expose the Kitu runtime to Unity hosts."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "unity", "ffi"]
categories = ["api-bindings", "game-development"]
include = ["src/**", "include/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
kitu-core = { version = "0.1.0", path = "../kitu-core" }
kitu-osc-ir = { version = "0.1.0", path = "../kitu-osc-ir" }
kitu-runtime = { version = "0.1.0", path = "../kitu-runtime" }
kitu-transport = { version = "0.1.0", path = "../kitu-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
