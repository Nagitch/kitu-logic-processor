[package]
name = "kitu-data-tmd"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
description = "Parser and loader utilities for Tanu Markdown (TMD) data."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "tmd", "data"]
categories = ["game-development", "parser-implementations"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
kitu-core = { version = "0.1.0", path = "../kitu-core" }
tmd-core = { version = "0.1.0", git = "https://github.com/Nagitch/tanu-markdown.git", rev = "715e8b23583757be7e1f0bd8abfbb1ce2364bd8b" }
serde_json = "1"
