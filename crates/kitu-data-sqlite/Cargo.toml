[package]
name = "kitu-data-sqlite"
version = "0.1.0"
edition = "2021"
publish = false
description = "SQLite-backed data utilities and schema helpers for Kitu tooling."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "sqlite", "data"]
categories = ["database", "game-development"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
