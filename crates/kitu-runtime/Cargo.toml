[package]
name = "kitu-runtime"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
description = "Tick-based orchestrator that wires ECS, transports, and scripting layers."
license = "MIT"
repository = "https://github.com/Nagitch/kitu-logic-processor"
readme = "README.md"
keywords = ["kitu", "runtime", "ecs"]
categories = ["game-development"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE*"]

[[example]]
name = "spatial_session"
required-features = ["rapier-physics"]

[features]
rapier-physics = ["dep:rapier3d"]

[dependencies]
kitu-core = { version = "0.1.0", path = "../kitu-core" }
kitu-ecs = { version = "0.1.0", path = "../kitu-ecs" }
kitu-transport = { version = "0.1.0", path = "../kitu-transport" }
kitu-osc-ir = { version = "0.1.0", path = "../kitu-osc-ir" }
kitu-app-actions = { version = "0.1.0", path = "../kitu-app-actions" }
serde = { version = "1", features = ["derive"] }
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism", "serde-serialize"], optional = true }
