[package]
name = "kitu-demo-game"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "kitu_demo_game"
path = "src/lib.rs"

[[bin]]
name = "kitu-demo-game-admin-host"
path = "src/bin/admin_host.rs"

[dependencies]
kitu-shell = { path = "../../crates/kitu-shell" }
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
kitu-app-actions = { path = "../../crates/kitu-app-actions" }
kitu-osc-ir = { path = "../../crates/kitu-osc-ir" }
kitu-runtime = { path = "../../crates/kitu-runtime" }
kitu-core = { path = "../../crates/kitu-core" }
kitu-ecs = { path = "../../crates/kitu-ecs" }
kitu-data-tmd = { path = "../../crates/kitu-data-tmd" }
kitu-data-sqlite = { path = "../../crates/kitu-data-sqlite" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
kitu-tsq1 = { path = "../../crates/kitu-tsq1" }
sha2 = "0.11"
hex = "0.4"
kitu-transport = { path = "../../crates/kitu-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
sha2 = "0.11"
hex = "0.4"
