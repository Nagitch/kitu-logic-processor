[package]
name = "kitu-replay-runner"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "kitu-replay-runner"

[[bin]]
name = "kitu-determinism-probe"
required-features = ["determinism-probe"]

[features]
determinism-probe = ["dep:kitu-core", "dep:kitu-ecs", "kitu-runtime/rapier-physics", "dep:rmp-serde", "dep:sha2"]

[dependencies]
anyhow = { workspace = true }
kitu-core = { path = "../../crates/kitu-core", optional = true }
kitu-ecs = { path = "../../crates/kitu-ecs", optional = true }
kitu-osc-ir = { path = "../../crates/kitu-osc-ir" }
kitu-runtime = { path = "../../crates/kitu-runtime" }
kitu-transport = { path = "../../crates/kitu-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = { version = "=1.3.1", optional = true }
sha2 = { version = "=0.11.1", optional = true }
